name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install & build frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run Go vet & tests
        run: |
          go vet ./...
          CGO_ENABLED=0 go test -v ./...
          go test -race ./...

      - name: Build static binary & validate content
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/inkbranch ./cmd/inkbranch
          /tmp/inkbranch validate --content-dir ./content
